# 服务器侧 override：配合「本地构建 → docker save/load」的无源码部署（IP 自签入口）。
#
# 用法（服务器 /opt/ai-gateway，docker/ 与 .env 同仓内布局）：
#   docker compose --env-file .env -f docker/compose.yml build        # 服务器构建（x86_64 原生）
#   # ——或「本地构建 → 传输」路线：本地 build 同名 tag → docker save | gzip → scp → docker load
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
#     -keyout docker/nginx/certs-server/privkey.pem -out docker/nginx/certs-server/fullchain.pem \
#     -days 825 -nodes -subj "/CN=<服务器IP>" -addext "subjectAltName=IP:<服务器IP>"
#   docker compose --env-file .env -f docker/compose.yml up migrate    # 一次性迁移
#   docker compose --env-file .env -f docker/compose.yml -f docker/compose.server.yml up -d
#
# 注意：仓库 .env 在根目录而 compose 文件在 docker/ 下——插值读不到，
#       所有 compose 命令都要带 --env-file .env（在仓库根执行）。
#
# 与基线 compose.yml 的差别：
#   - 8 个自建服务去掉 build:（服务器无源码上下文，镜像来自 docker load；
#     升级 = 本地重建同名 tag → save/load → up -d，compose 自动换容器）
#   - nginx 换 nginx.ip.conf（自签证书 + 8443 管理后台），多暴露 8443
#   - certbot 归入 profile 永不启动（无域名；将来切域名部署时改回基线 compose.yml）

services:
  nginx:
    ports:
      - '8443:8443' # 管理后台（自签证书，无子域可用时的独立端口方案）
    volumes:
      - ./nginx/nginx.ip.conf:/etc/nginx/conf.d/default.conf:ro

  certbot:
    profiles: ['certbot'] # 无域名用不上；显式 --profile certbot 才会启动

  gateway:
    build: !reset null
  client-api:
    build: !reset null
  admin-api:
    build: !reset null
  worker:
    build: !reset null
  trace-receiver:
    build: !reset null
  console-client:
    build: !reset null
  console-admin:
    build: !reset null
  migrate:
    build: !reset null
