# IP 直连入口（无域名场景——配 compose.server.yml 使用）
#
# 与 nginx.conf（域名 + Let's Encrypt）的差别：
#   - 证书：自签（docker/nginx/certs-server/，openssl 生成，SAN 含服务器 IP），
#     浏览器首次访问需手动信任一次
#   - 管理后台：无子域可用，走独立端口 8443（用户面板 443 / 管理后台 8443 天然隔离）
#   - 刻意不加 HSTS：IP 入口加 HSTS 会连带封锁同 IP 其它端口的 http 访问
#   - certbot 不启动（compose.server.yml 中归档进 profile）
# 后续有域名后：certbot 签发 → 切回 nginx.conf 即可，应用零改动。

upstream gateway_upstream {
    server gateway:8083;
}

upstream client_api_upstream {
    server client-api:8081;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

upstream console_client_upstream {
    server console-client:3001;
}

upstream console_admin_upstream {
    server console-admin:3002;
}

# ==================== HTTPS 用户面板 + API（主入口 443） ====================
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/self/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/self/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 16m;

    # 用户身份与支付回调属于 client-api，必须放在通用 /v1/ 规则之前
    location ^~ /v1/oauth/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location ~ ^/v1/payments/notify/(epay|stripe)$ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location /v1/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /oauth/token {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    location / {
        proxy_pass http://console_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==================== HTTPS 管理后台（独立端口 8443） ====================
# 无域名无法用子域分流，改独立端口；与用户面 443 物理隔离（会话 cookie 不同源）。
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/self/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/self/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://console_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==================== HTTP 80（健康探测 + 重定向） ====================
server {
    listen 80;
    server_name _;

    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
